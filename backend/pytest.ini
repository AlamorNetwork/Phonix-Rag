[pytest]
asyncio_mode = auto

# Only ever collect our own tests. `workspaces/` holds agent-generated projects, and those
# projects contain their own test files - without this, running the backend suite discovers
# and *executes* code an agent wrote. That is precisely the boundary the Tool Gateway exists
# to enforce, and it must not be walked around by the test runner.
testpaths = tests
norecursedirs = workspaces .git .venv node_modules
